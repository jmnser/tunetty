# tunetty for tmux, written by `tunetty -init`. Load it from $HOME/.tmux.conf:
#   source-file "$HOME/.config/tunetty/tmux.conf"

# Now playing with a progress bar on a second status line, refreshed every
# second. It has its own line, so status-right-length does not cut it off.
set -g status-interval 1
set -g status 2
set -g status-format[1] '#[align=centre]#(tunetty status --bar 30)'

# prefix + m opens tunetty in a popup and, pressed inside it, closes it again.
# This replaces tmux's default prefix + m (mark pane). tunetty runs in its own
# session, so closing the popup (also with prefix + d) keeps the music
# playing. The session is named "♪ tunetty" because tmux sorts sessions by
# name and the note sorts after every plain name, keeping it at the bottom of
# the session list.
bind-key m if-shell -F '#{==:#{session_name},♪ tunetty}' 'detach-client' \
  "display-popup -E -w 90% -h 90% \"TMUX= tmux new-session -A -s '♪ tunetty' tunetty\""

# Playback from any pane, without prefix: F8 back, F9 forward, F10 play/pause,
# F11 volume down, F12 volume up, and Shift+F8/F9 to seek. Shells leave these
# keys alone.
bind-key -n F8    run-shell -b 'tunetty ctl prev'
bind-key -n F9    run-shell -b 'tunetty ctl next'
bind-key -n F10   run-shell -b 'tunetty ctl play-pause'
bind-key -n F11   run-shell -b 'tunetty ctl volume-down'
bind-key -n F12   run-shell -b 'tunetty ctl volume-up'
bind-key -n S-F8  run-shell -b 'tunetty ctl seek-back'
bind-key -n S-F9  run-shell -b 'tunetty ctl seek-forward'
